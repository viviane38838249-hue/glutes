<style>
  /* Ajustes de proporção e alinhamento — não altera o style.css global, só reforça/organiza este template */

  .vsl-screen{
    display:flex;
    min-height:100svh; /* melhor que 100vh em mobile (evita barra do navegador cortando) */
    box-sizing:border-box;
  }

  .vsl-screen .container-fluid{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }

  .vsl-wrapper{
    width:100%;
    max-width:405px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .vsl-badge-wrap{
    margin-bottom:14px;
  }

  .vsl-badge{
    display:inline-block;
    max-width:100%;
    white-space:normal;
    line-height:1.4;
  }

  .vsl-title-wrap{
    margin-bottom:10px;
    width:100%;
  }

  .vsl-title{
    margin:0;
    /* fonte fluida: nunca estoura em telas pequenas, cresce em telas maiores */
    font-size:clamp(24px, 7vw, 34px);
    word-wrap:break-word;
  }

  .vsl-subtitle-wrap{
    margin-bottom:20px;
    width:100%;
    padding:0 8px;
  }

  .vsl-subtitle{
    font-size:clamp(13px, 3.6vw, 15px);
    margin:0 auto;
    max-width:340px;
  }

  .vsl-video-card{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  vturb-smartplayer{
    width:100% !important;
    max-width:400px !important;
    margin:0 auto !important;
  }

  /* Telas bem pequenas (iPhone SE etc.) */
  @media (max-width:360px){
    .vsl-video-card{padding:6px;border-radius:16px;}
    .vsl-title{font-size:22px;}
  }

  /* Telas maiores (tablet/desktop) — evita que o card fique gigante e desalinhado */
  @media (min-width:600px){
    .vsl-wrapper{max-width:460px;}
  }
</style>
